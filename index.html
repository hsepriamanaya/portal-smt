function icaItem(g,k,it,set){const key=g[0]+"."+(k+1),no=icaNo(g[0])+"."+(k+1),sub=it[1]||[];

const icaSelRO=i=>{const a=i&&i.invData&&!Array.isArray(i.invData)?i.invData.ica:null;return a&&Array.isArray(a.sel)?a.sel:[]};
const ICA_IDX=(()=>{const m={};ICAC.forEach((t,k)=>m["C."+(k+1)]={t,g:"C",l:1,o:k});ICAK.forEach((t,k)=>m["K."+(k+1)]={t,g:"K",l:1,o:k});
ICA_G.forEach(g=>g[2].forEach((it,k)=>{const key=g[0]+"."+(k+1);m[key]={t:it[0],g:g[0],l:1,o:k};(it[1]||[]).forEach((s,n)=>{m[key+"."+(n+1)]={t:s,g:g[0],l:2,o:n}})}));return m})();
let RDC=null;
/* Satu kali lintas data: jumlah insiden per butir, per kelompok, dan berapa insiden yang sudah punya rincian */
function rcCount(d){const cnt={},gc={},ic={};let nd=0;
d.forEach(i=>{const rc=Array.isArray(i.rc)?i.rc:[],seen=new Set(),gs=new Set(),cs=new Set();
icaSelRO(i).forEach(k=>{const m=ICA_IDX[k];if(!m||seen.has(k))return;
if(m.g!="C"&&m.g!="K"){const x=RC2G.indexOf(m.g);if(x<0||!rc.includes(x))return} /* butir hanya dihitung bila kelompoknya masih tercentang */
seen.add(k);gs.add(m.g);const q=icamOf(k);if(q)cs.add(q)});
if(seen.size)nd++;seen.forEach(k=>cnt[k]=(cnt[k]||0)+1);gs.forEach(g=>gc[g]=(gc[g]||0)+1);cs.forEach(q=>ic[q]=(ic[q]||0)+1)});
return{cnt,gc,ic,nd,n:d.length}}
const rcSort=(a,b)=>b[1]-a[1]||a[2]-b[2];
function rcRows(group,sub){const g=ICA_G.find(x=>x[0]==group);if(!g||!RDC)return[];const C=RDC.cnt,out=[];
g[2].map((it,k)=>[it,C[group+"."+(k+1)]||0,k]).filter(p=>p[1]).sort(rcSort).forEach(([it,c,k])=>{out.push([it[0],c]);
if(sub)(it[1]||[]).map((s,n)=>[s,C[group+"."+(k+1)+"."+(n+1)]||0,n]).filter(z=>z[1]).sort(rcSort).forEach(z=>out.push(["↳ "+z[0],z[1]]))});
return out}

const rcFlat=p=>Object.keys(RDC.cnt).filter(k=>ICA_IDX[k].g==p).map(k=>[ICA_IDX[k].t,RDC.cnt[k],ICA_IDX[k].o]).sort(rcSort).map(r=>[r[0],r[1]]);
