/* ===== Unggah file (kecil langsung, besar bertahap per 2 MB, maks. 100 MB) ===== */
const CHK=2097152,MAXF=104857600;
const b64c=b=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(",")[1]);r.onerror=no;r.readAsDataURL(b)});
const imgB64=f=>new Promise((ok,no)=>{const rd=new FileReader();rd.onerror=no;rd.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.8).split(",")[1])};im.src=rd.result};rd.readAsDataURL(f)});
async function upFile(f,ctx){st("Mengunggah "+f.name+"…");
if(f.type.startsWith("image")){const b=await imgB64(f);return enq(()=>api("upload",{...ctx,name:f.name,type:"image/jpeg",b64:b}))}
if(f.size>MAXF)throw new Error("ukuran maksimal 100 MB");const t=f.type||"application/pdf";
if(f.size<=CHK)return enq(async()=>api("upload",{...ctx,name:f.name,type:t,b64:await b64c(f)}));
const init=await enq(()=>api("uploadInit",{...ctx,name:f.name,type:t,size:f.size}));let res;
for(let s=0;s<f.size;s+=CHK){const e=Math.min(s+CHK,f.size);
res=await enq(async()=>api("uploadChunk",{uri:init.uri,start:s,end:e,size:f.size,b64:await b64c(f.slice(s,e))}));
st(`Mengunggah ${f.name} ${Math.round(e/f.size*100)}%`)}
if(!res||!res.id)throw new Error("unggah belum selesai, coba lagi");return{id:res.id,n:f.name,t:t}}

for(const f of fs){try{r.ev.push(await upFile(f,{incId:r.incId,rtpId:r.id}));ok++}catch(e){alert(f.name+": "+e.message)}}
if(ok){r.log.push(`${new Date().toLocaleDateString("id-ID")}: ${ok} bukti ditambahkan`);save()}else st("");render()}

$("#app").innerHTML=`<div class="card"><form onsubmit="return add(event)">${FLD_S(o||{ir:`IR-${String(n).padStart(3,"0")}/HSE-DP/LHT/`})}<h4 class="sec">Orang yang terlibat</h4><div id="ppl">${[o||{},...ot].map((p,k)=>personCard(p,k)).join("")}</div><button type="button" onclick="addPerson()">+ Tambah orang terlibat</button><p class="mu">${o?"":"Setelah disimpan, lanjutkan ke halaman detail untuk mengisi Root Cause dan RTP."}</p><button class="pri">Simpan</button> <button type="button" onclick="${o?`go('detail','${o.id}')`:"go('list')"}">Batal</button></form></div>`;renum()}
function add(e){e.preventDefault();const o=V.ed?S.inc.find(x=>x.id==V.ed):{id:"i"+Date.now(),rc:[],invReport:[],others:[]};
const fv={};new FormData(e.target).forEach((x,k)=>{fv[k]=k in fv?[].concat(fv[k],x):x});
const G={};Object.keys(fv).forEach(k=>{const m=k.match(/^(o\d+_)?(.*)$/),p=m[1]||"";(G[p]=G[p]||{})[m[2]]=fv[k]});G[""]=G[""]||{};
const ex=Object.keys(G).filter(k=>k).sort((a,b)=>parseInt(a.slice(1))-parseInt(b.slice(1))),bad=[];
const fix=(g,F,tag)=>F.forEach(f=>{const k=f[0];
if(f[2]=="combo"){if(g[k]=="__other__"){const t=String(g[k+"__o"]||"").replace(/\s+/g," ").trim();if(t)g[k]=canon(k,t);else{bad.push(f[1]+tag);g[k]=""}}delete g[k+"__o"]}
else if(f[2]=="chk"){const v=[].concat(g[k]||[]),mt=String(g[k+"__o"]||"").split(",").map(x=>x.replace(/\s+/g," ").trim()).filter(Boolean).map(x=>canon(k,x));let a=[...new Set([...v,...mt])];if(a.length>1)a=a.filter(x=>x!="NIHIL");g[k]=a.join(", ");delete g[k+"__o"]}});
fix(G[""],[...FLD,...PF],"");ex.forEach((p,x)=>fix(G[p],PF," (orang #"+(x+2)+")"));
if(!G[""].date){alert("Tanggal kejadian wajib diisi.");return false}
if(bad.length){alert("Isi secara manual, atau pilih dari daftar: "+bad.join(", "));return false}
Object.assign(o,G[""]);o.others=ex.map(p=>PK.reduce((a,k)=>(a[k]=String(G[p][k]??"").trim(),a),{})).filter(p=>PK.some(k=>p[k]));
o.mon=MON[+o.date.slice(5,7)-1]||"";["shift","day"].forEach(k=>o[k]=+o[k]||"");["cost","dlMan","dlUnit"].forEach(k=>o[k]=+o[k]||0);if(!V.ed)S.inc.push(o);V.ed=null;save();go("detail",o.id);return false}
function extra(d){const N=s=>String(s??"").trim().replace(/\s+/g," ");
const og=(f,id,ord,t="bar",o)=>{const m={};d.forEach(i=>{const k=N(f(i));if(k)m[k]=(m[k]||0)+1});const ks=[...ord.filter(k=>m[k]),...Object.keys(m).filter(k=>!ord.includes(k)).sort((a,b)=>m[b]-m[a])];chart(id,t,ks,ks.map(k=>m[k]),o)};
const P=d.flatMap(pp),ogp=(f,id,ord,t="bar",o={})=>{const m={};P.forEach(p=>{[].concat(f(p)).forEach(x=>{const k=N(x);if(k)m[k]=(m[k]||0)+1})});const ks=[...ord.filter(k=>m[k]),...Object.keys(m).filter(k=>!ord.includes(k)).sort((a,b)=>m[b]-m[a])];chart(id,t,ks,ks.map(k=>m[k]),Object.assign({unit:"orang"},o))};
og(i=>i.day,"c10",DAYS);ogp(i=>i.pos,"c11",[],"bar",{h:1});ogp(i=>i.hired,"c12",HIRED);ogp(i=>i.age,"c13",AGE);ogp(i=>i.kage,"c14",KAGE);
ogp(i=>{const k=N(i.kt);return k?k[0].toUpperCase()+k.slice(1).toLowerCase():""},"c15",[],"doughnut");ogp(i=>injs(i),"c16",[],"bar",{h:1,total:P.length});
ogp(i=>({Y:"Fatigue (Ya)",N:"Tidak fatigue"})[String(i.fatigue).toUpperCase()],"c17",[],"doughnut");
ogp(i=>String(i.inMess).toUpperCase()=="Y"?"Inside Mess":String(i.outMess).toUpperCase()=="Y"?"Outside Mess":"","c18",[],"doughnut");og(i=>invOf(i),"c19",INV,"doughnut")}
/* ===== Penyimpanan: antrean berurutan + coba ulang otomatis ===== */
let Q=Promise.resolve(),T;const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const enq=fn=>{const p=Q.then(async()=>{for(let k=0;;k++){try{return await fn()}catch(e){if(!e.net||k>=2)throw e;await sleep(1500*(k+1))}}});Q=p.catch(()=>{});return p};
function st(m,bad){const e=$("#st");e.textContent=m;e.className=bad?"bad":"";e.style.display=m?"block":"none"}
function save(){clearTimeout(T);st("Menyimpan…");T=setTimeout(flush,700)}
function flush(){const jobs=[];
S.inc.forEach(i=>{const j=JSON.stringify(i);if(SNAP[i.id]!=j)jobs.push(["saveInc",i,i.id,j])});
S.rtp.forEach(r=>{const j=JSON.stringify(r);if(SNAP[r.id]!=j)jobs.push(["saveRtp",r,r.id,j])});
const ids=new Set([...S.inc,...S.rtp].map(x=>x.id));Object.keys(SNAP).filter(k=>!ids.has(k)&&k[0]=="r").forEach(k=>jobs.push(["delRtp",{id:k},k,null]));
if(!jobs.length)return st("");st("Menyimpan…");
jobs.reduce((p,[a,d,id,j])=>p.then(()=>enq(()=>api(a,d)).then(()=>{j===null?delete SNAP[id]:SNAP[id]=j})),Promise.resolve())
.then(()=>{st("Tersimpan ✓");setTimeout(()=>{if($("#st").textContent=="Tersimpan ✓")st("")},1500)}).catch(e=>st("Gagal menyimpan: "+e.message+" — klik di sini untuk coba lagi",1))}
/* ===== Filter tahun/status & closing insiden ===== */
const yr=i=>String(i.date||"").slice(0,4),stOf=i=>i.status||"Open",today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const years=()=>[...new Set(S.inc.map(yr).filter(Boolean))].sort().reverse();
const F=()=>S.inc.filter(i=>(!V.y||yr(i)==V.y)&&(!V.co||i.co==V.co)&&(!V.st||stOf(i)==V.st)&&(!V.iv||invOf(i)==V.iv)&&(!V.dp||i.dept==V.dp)&&(!V.jb||pp(i).some(p=>p.pos==V.jb))&&(!V.lc||i.loc==V.lc)&&(!V.un||i.unit==V.un)&&(!V.cl||i.cls==V.cl)&&(!V.jn||i.jns==V.jn));
const sel=(k,all,o)=>`<select onchange="V.${k}=this.value;render()"><option value="">${all}</option>${o.map(([v,l])=>`<option value="${esc(v)}" ${V[k]==v?"selected":""}>${esc(l)}</option>`).join("")}</select>`;
const selY=()=>sel("y","Semua tahun",years().map(y=>[y,y])),selC=()=>sel("co","Semua perusahaan",opts("co").map(c=>[c,c])),selS=()=>sel("st","Semua status",[["Open","Open"],["Closed","Closed"]]),selI=()=>sel("iv","Semua investigasi",INV.map(x=>[x,x])),selX=()=>`<details ${V.xo?"open":""} ontoggle="V.xo=this.open" style="margin:-4px 0 12px"><summary class="mu" style="cursor:pointer">Filter lanjutan (departemen, jabatan, lokasi, unit, klasifikasi, jenis)</summary><div class="row" style="margin-top:8px">${[["dp","Semua departemen","dept"],["jb","Semua jabatan","pos"],["lc","Semua lokasi","loc"],["un","Semua unit","unit"],["cl","Semua klasifikasi","cls"],["jn","Semua jenis","jns"]].map(([k,a,f])=>sel(k,a,opts(f).map(x=>[x,x]))).join("")}</div></details>`,
selP=()=>`<select onchange="V.pm=this.value;render()" title="Label pada grafik">${[["both","Label: jumlah & %"],["n","Label: jumlah"],["p","Label: persentase"]].map(([v,l])=>`<option value="${v}" ${V.pm==v?"selected":""}>${l}</option>`).join("")}</select>`;
function closeCard(i){const R=rp(i.id),miss=[];if(!R.length)miss.push("Belum ada RTP");R.forEach(r=>{if(r.status!="Done")miss.push(`RTP "${r.action}" belum selesai`);else if(!r.ev.length)miss.push(`RTP "${r.action}" belum ada bukti`)});
if(stOf(i)=="Closed")return `<div class="card"><h3>Status insiden</h3><span class="tag Closed">CLOSED</span> ${esc(i.closeDate)} · oleh ${esc(i.closeBy)}<p>${esc(i.closeNote)||"-"}</p>${ME.role=="admin"?`<button onclick="reopen('${i.id}')">Buka kembali (reopen)</button>`:""}</div>`;
return `<div class="card"><h3>Status insiden</h3><span class="tag Open">OPEN</span>${miss.length?`<ul class="mu">${miss.map(m=>`<li>${esc(m)}</li>`).join("")}</ul><p class="mu">Closing aktif setelah semua RTP selesai dan memiliki bukti.</p>`:`<form onsubmit="return closeInc(event,'${i.id}')" class="f" style="margin-top:8px"><div><label>Tanggal closing</label><input type="date" name="d" value="${today()}" required></div><div><label>Ditutup oleh</label><input name="by" required></div><div style="grid-column:1/-1"><label>Catatan penutupan</label><textarea name="n" rows="2"></textarea></div><div><button class="pri">Closing insiden</button></div></form>`}</div>`}
function closeInc(e,id){e.preventDefault();const i=S.inc.find(x=>x.id==id),f=new FormData(e.target);Object.assign(i,{status:"Closed",closeDate:f.get("d"),closeBy:f.get("by"),closeNote:f.get("n")});save();render();return false}
function reopen(id){if(!confirm("Buka kembali insiden ini?"))return;Object.assign(S.inc.find(x=>x.id==id),{status:"Open",closeDate:"",closeBy:"",closeNote:""});save();render()}
/* ===== Investigasi kecelakaan & laporan penyelidikan ===== */
function invCard(i){const R=i.invReport||[],a=ME&&ME.role=="admin";
return `<div class="card"><h3>Investigasi kecelakaan</h3><div class="row"><span class="tag ${invCls(i)}">${esc(invOf(i))}</span>${a?`<select onchange="setInv('${i.id}',this.value)">${INV.map(x=>`<option ${invOf(i)==x?"selected":""}>${x}</option>`).join("")}</select><label class="btn" style="margin:0;color:var(--tx)">📎 Unggah laporan penyelidikan<input type="file" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx" hidden onchange="uplInv('${i.id}',this.files)"></label>`:""}</div>${R.length?`<div class="ev">${R.map((e,k)=>`<span><a class="chip" target="_blank" rel="noopener" href="https://drive.google.com/file/d/${e.id}/view">📄 ${esc(e.n)}</a><a class="chip" href="https://drive.google.com/uc?export=download&id=${e.id}" title="Unduh">⬇</a>${a?` <button onclick="delInv('${i.id}',${k})" title="Hapus dari daftar">✕</button>`:""}</span>`).join("")}</div>`:'<p class="mu">Belum ada laporan penyelidikan kecelakaan.</p>'}</div>`}
function setInv(id,v){S.inc.find(x=>x.id==id).invStatus=v;save();render()}
function delInv(id,k){if(!confirm("Hapus laporan ini dari daftar? (file tetap tersimpan di Google Drive)"))return;S.inc.find(x=>x.id==id).invReport.splice(k,1);save();render()}
/* ===== Login, navigasi, render ===== */
async function start(){$("#app").innerHTML='<p class="mu">Memuat data…</p>';try{S=await api("getAll");S.inc.forEach(i=>{if(!i.mon&&i.date)i.mon=MON[+i.date.slice(5,7)-1]||"";if(i.dept=="HR & GA")i.dept="HRGA";if(!Array.isArray(i.others))i.others=[]});snap();if(!V.y)V.y=years()[0]||"";render()}catch(e){if(e.message!="AUTH")$("#app").innerHTML='<div class="card">'+esc(e.message=="FORBIDDEN"?"Email Anda belum terdaftar di portal. Hubungi admin HSE.":e.message)+'</div>'}}

/* ===== Login manual (username & password), navigasi, tampilan ===== */
const ICO={dash:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',form:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',rca:'<circle cx="6" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><path d="M6 9v3a3 3 0 0 0 3 3h6"/>',rtp:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>'};
function nav(){const a=ME&&ME.role=="admin",t=[["dash","Dashboard"],["list","Data Insiden"],...(a?[["form","Input Resume"]]:[]),["rca","Root Cause"],["rtp","RTP & Bukti"]];
$("#nav").innerHTML=t.map(([k,l])=>`<button class="${V.p==k||(k=="list"&&V.p=="detail")?"on":""}" onclick="go('${k}')"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICO[k]}</svg><span>${l}</span></button>`).join("");
$("#usr").innerHTML=ME&&ME.role!="public"?`<div class="who"><b>${esc(ME.nama)}</b><span class="tag">${esc(ME.role)}</span></div><button onclick="logout()">Keluar</button>`:`<div class="who"><b>Mode Publik</b><span class="mu">Hanya lihat & unduh</span></div><button class="pri" onclick="go('login')">Masuk petugas</button>`}
const PT={dash:["Dashboard","Ringkasan insiden, tren, dan penyebab"],list:["Data Insiden","Cari dan buka rincian setiap insiden"],detail:["Detail Insiden","Resume, investigasi, root cause, dan tindak lanjut"],rca:["Analisis Root Cause","Sebaran penyebab dasar insiden"],rtp:["RTP & Bukti Perbaikan","Pantau progres perbaikan beserta buktinya"]};
function render(){CH.forEach(c=>c.destroy());CH=[];theme();nav();({dash,list,form,detail,rca,rtp:rtpAll,login:loginView})[V.p]();
const t=V.p=="form"?[V.ed?"Edit Resume Insiden":"Input Resume Insiden","Lengkapi data kejadian, kronologi, dan orang yang terlibat"]:PT[V.p];
if(t)$("#app").insertAdjacentHTML("afterbegin",`<div class="ph"><h2>${t[0]}</h2><p>${t[1]}</p></div>`);
document.body.classList.toggle("ro",ME.role!="admin"&&ME.role!="pic");
if(ME.role!="admin"){document.querySelectorAll(".rc input").forEach(x=>x.disabled=true);document.querySelectorAll("#app form:not(.keep)").forEach(f=>f.style.display="none")}}
function loginView(){$("#app").innerHTML=`<div class="card login"><div class="lg">🔒</div><h3>Masuk Petugas</h3><p class="mu">Khusus HSE/PIC untuk input, edit, dan unggah. Pengunjung tetap dapat melihat data tanpa masuk.</p><form class="keep" onsubmit="return doLogin(event)"><label>Username</label><input name="u" autocomplete="username" required><label style="margin-top:8px">Password</label><input name="p" type="password" autocomplete="current-password" required><div id="lerr" class="err"></div><button class="pri" style="width:100%;margin-top:8px">Masuk</button></form></div>`}
async function doLogin(e){e.preventDefault();const f=new FormData(e.target),b=e.target.querySelector("button");b.disabled=true;
try{const r=await api("login",{username:f.get("u"),password:f.get("p")});TOKEN=r.token;sessionStorage.setItem("tk",TOKEN);V.p="dash";await start()}catch(x){$("#lerr").textContent=x.message;b.disabled=false}return false}
function logout(){TOKEN="";sessionStorage.removeItem("tk");V.p="dash";start()}
window.onload=()=>start();
</script></body></html>
